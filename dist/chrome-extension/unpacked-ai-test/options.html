<!DOCTYPE html><html ng-app="App"><head><meta charset="utf-8"><link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="js/lib/angular/angular-csp.css"><title>品聘插件配置</title><style>body {
    font-family: 'Microsoft YaHei', Arial, sans-serif;
}</style></head><body ng-controller="OptionsCtrl"><div class="card" style="width: 600px; margin: 20px auto;"><div class="card-header">品聘插件配置</div><div class="card-body"><form name="form" ng-submit="submit(options)" novalidate><div class="form-group row"><label class="col-form-label col-sm-4">服务器地址:</label><div class="col-sm-8"><input class="form-control" name="api" type="url" placeholder="例(http://demo.ppinsoft.cn)" ng-model="options.api" required ng-class="{'is-invalid': (form.$submitted || form.api.$touched) &amp;&amp; form.api.$invalid}"></div></div><!--.form-group.rowlabel.col-form-label.col-sm-4 用户名:
.col-sm-8
    input.form-control(name="username", type="text", ng-model="options.username", required, ng-class="{'is-invalid': (form.$submitted || form.username.$touched) && form.username.$invalid}")
--><!--.form-group.rowlabel.col-form-label.col-sm-4 密码:
.col-sm-8
    input.form-control(name="password", type="password", ng-model="options.password", required, ng-class="{'is-invalid': (form.$submitted || form.password.$touched) && form.password.$invalid}")
--><div class="form-group row" ng-if="debug&gt;=7"><label class="col-form-label col-sm-4">插件服务器地址:</label><div class="col-sm-8"><input class="form-control" name="server" type="url" placeholder="http://demo.ppinsoft.cn" ng-model="options.server" required ng-class="{'is-invalid': (form.$submitted || form.server.$touched) &amp;&amp; form.server.$invalid}"></div></div><!--.form-group.row.col-sm-4 插件更新:
.col-sm-8
    .form-check.form-check-inline
        input.form-check-input(name="dynamicUpdate", type="checkbox", ng-model="options.dynamicUpdate")
        label.form-check-label 动态更新
    .form-check.form-check-inline
        input.form-check-input(name="autoCheckUpdate", type="checkbox", ng-model="options.autoCheckUpdate")
        label.form-check-label 自动检查更新
--><div class="form-group row"><div class="col-sm-4"></div><div class="col-sm-8"><button class="btn btn-sm btn-primary" type="submit" ng-disabled="form.$invalid">保存</button></div></div></form></div></div><script src="js/lib/jquery/jquery.js"></script><script src="js/lib/angular/angular.min.js"></script><script src="js/core/utils.js"></script><script src="js/options.js"></script>
<script src="js/lib/jquery/jquery.js"></script><script src="js/lib/angular/angular.min.js"></script><script src="js/core/utils.js"></script><script src="js/options.js"></script>
<!-- ============ Talent Nexus AI Connector settings (additive) ============ -->
<div class="tn-card" style="width:600px;margin:20px auto;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(20,55,90,.18);background:rgba(235,246,255,.82);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.65);">
  <div class="tn-card-head" style="background:rgba(11,42,91,.92);color:#eaf2ff;padding:10px 16px;font:700 15px/1.2 system-ui,sans-serif;letter-spacing:.3px;" data-tn="connector">Talent Nexus Connector</div>
  <div class="tn-card-body" style="padding:16px 18px;color:#0b1b3a;font:500 13px/1.5 system-ui,sans-serif;">
    <div style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:6px;color:#13386e;" data-tn="atsLangLabel">ATS Interface Language</div>
      <select id="tnAtsLang" style="width:100%;padding:8px 11px;border-radius:10px;border:1px solid rgba(120,170,255,.45);background:rgba(255,255,255,.85);color:#0b1b3a;font:500 14px/1 system-ui,sans-serif;">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="custom">Custom / 自訂</option>
      </select>

    </div>
    <details style="margin-bottom:12px;">
      <summary style="cursor:pointer;color:#2b5a9e;font-weight:700;" data-tn="advanced">Advanced</summary>
      <div style="margin-top:8px;">
        <div style="font-weight:700;margin-bottom:6px;color:#13386e;" data-tn="customAtsLabel">Custom ATS endpoint</div>
        <input id="tnAtsCustom" type="url" placeholder="http://your-ats.example/" style="width:100%;padding:8px 11px;border-radius:10px;border:1px solid rgba(120,170,255,.45);background:rgba(255,255,255,.85);color:#0b1b3a;font:500 14px/1 system-ui,sans-serif;" />
        <div style="margin-top:6px;color:#5a6b85;font:500 12px/1.3 system-ui,sans-serif;" data-tn="customNote">Unknown custom URLs are preserved and not overwritten by presets.</div>
        <div id="tnAtsEndpoint" style="margin-top:8px;color:#5a6b85;font:500 12px/1.3 system-ui,sans-serif;word-break:break-all;"></div>
      </div>
    </details>
    <button id="tnAtsSave" type="button" style="background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:10px 20px;font:700 14px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 22px rgba(30,80,180,.35);" data-tn="save">Save Connector Settings</button>
    <span id="tnAtsSaved" style="margin-left:10px;color:#1f7a3d;font:600 12px/1 system-ui,sans-serif;display:none;" data-tn="saved">Saved</span>
  </div>
</div>
<script src="connector-options.js"></script>
</body></html>
