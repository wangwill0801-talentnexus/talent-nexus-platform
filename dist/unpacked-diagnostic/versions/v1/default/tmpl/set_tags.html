<script type="text/ng-template" id="tmpl/set_tags.html"><div class="modal" id="setTags"><form class="form-horizontal" name="form" novalidate="novalidate" ng-submit="save()"><div class="modal-header"><a class="close" style="float: right" ng-click="cancel()">x</a><h3> 设置关注词</h3></div><div class="modal-body"><div class="form-group" ng-init="tags3=[]"><ui-select class="tag" ng-model="data.tags" ng-model-options="{debounce: 500}" theme="bootstrap" multiple="multiple" tagging="tagging" tagging-label="false" style="height: auto;"><ui-select-match allow-clear="true">{{$item}}</ui-select-match><ui-select-choices repeat="item as item in tags3"><div>{{item}}</div></ui-select-choices></ui-select></div><div class="form-group" style="text-align: right;"><button class="btn" type="submit" style="background:#1D9A1D;color: #fff;" ng-disabled="setBtn">保存</button></div></div></form></div></script>
